name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck --severity=error scripts/*.sh scripts/lib/*.sh .claude/statusline.sh

  brewfile:
    name: Validate Brewfile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Brewfile branches on HOMEBREW_DOTFILES_NO_ADMIN, so both paths have to
      # parse. Checking only the default would let a syntax error hide in the
      # no-admin branch until someone provisions a machine without admin rights.
      - name: Parse Brewfile (admin)
        run: HOMEBREW_DOTFILES_NO_ADMIN=0 brew bundle list --file=Brewfile >/dev/null
      - name: Parse Brewfile (no-admin)
        run: HOMEBREW_DOTFILES_NO_ADMIN=1 brew bundle list --file=Brewfile >/dev/null
